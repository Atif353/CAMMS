services:
  - type: web
    name: camms-backend
    env: node
    region: oregon
    plan: free
    # Install Node.js dependencies, generate Prisma client, and Python dependencies
    buildCommand: npm install && npm run prisma:generate && (python3 -m pip install --user pandas matplotlib openpyxl || pip3 install --user pandas matplotlib openpyxl || echo "Python dependencies installation skipped - reports will use JSON fallback")
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Add these in Render dashboard:
      # DATABASE_URL (from Supabase/Neon)
      # JWT_SECRET (generate a strong secret)
      # JWT_REFRESH_SECRET (generate a strong secret)
      # FRONTEND_URL (your frontend deployment URL)

